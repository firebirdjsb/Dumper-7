name: Build PR510 Test DLL

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'Dumper/**'
      - 'Dumper-7.sln'
      - '.github/workflows/build-pr510-test.yml'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Release x64 with map
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Host 'Trying the project-native v142 toolset...'
          & msbuild 'Dumper\Dumper.vcxproj' /m /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v142 /p:GenerateMapFile=true /p:MapFileName=Dumper-7.map
          if ($LASTEXITCODE -ne 0) {
            Write-Host 'v142 build failed or is unavailable; retrying with v143...'
            & msbuild 'Dumper\Dumper.vcxproj' /m /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /p:GenerateMapFile=true /p:MapFileName=Dumper-7.map
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Locate build outputs
        shell: pwsh
        run: |
          $dlls = Get-ChildItem -Path . -Recurse -File -Filter '*.dll'
          if (-not $dlls) {
            Write-Error 'No DLL was produced.'
            exit 1
          }
          $dlls | ForEach-Object { Write-Host $_.FullName }
          Get-ChildItem -Path . -Recurse -File -Filter '*.map' | ForEach-Object { Write-Host $_.FullName }

      - name: Stage Dumper DLL
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          $dll = Get-ChildItem -Path . -Recurse -File -Filter 'Dumper-7.dll' | Select-Object -First 1
          if (-not $dll) {
            $dll = Get-ChildItem -Path . -Recurse -File -Filter '*.dll' | Where-Object { $_.FullName -notmatch 'ExternalDependencies' } | Select-Object -First 1
          }
          if (-not $dll) {
            Write-Error 'Could not locate the Dumper DLL.'
            exit 1
          }
          Copy-Item $dll.FullName 'artifact\Dumper-7-PR510-x64.dll'
          $pdb = [System.IO.Path]::ChangeExtension($dll.FullName, '.pdb')
          if (Test-Path $pdb) { Copy-Item $pdb 'artifact\Dumper-7-PR510-x64.pdb' }
          $map = Get-ChildItem -Path . -Recurse -File -Filter 'Dumper-7.map' | Select-Object -First 1
          if ($map) { Copy-Item $map.FullName 'artifact\Dumper-7-PR510-x64.map' }
          Get-ChildItem artifact

      - name: Upload test build
        uses: actions/upload-artifact@v4
        with:
          name: Dumper-7-PR510-x64
          path: artifact/*
          if-no-files-found: error
